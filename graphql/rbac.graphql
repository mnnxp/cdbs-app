# ============================================================================
# COMPANY RBAC (through members & roles)
# ============================================================================

query GetCompanyMembers($companyUuid: UUID!) {
  companyMembers(companyUuid: $companyUuid) {
    user {
      uuid
      firstname
      lastname
      username
      imageFile {
        uuid
        filename
        filesize
        downloadUrl
      }
    }
    companyRole {
      role {
        roleMemberId
        name
      }
      permissions {
        typeAccessId
        langId
        name
      }
    }
    isEnabled
    createdAt
    updatedAt
  }
}

query GetCompanyRoles($companyUuid: UUID!) {
  companyRoles(companyUuid: $companyUuid) {
    role {
      roleMemberId
      name
    }
    permissions {
      typeAccessId
      langId
      name
    }
  }
}

# Add member to company
mutation AddCompanyMember($varAddCompanyMember: IptCompanyMemberData!) {
  addCompanyMember(args: $varAddCompanyMember)
}

# Change member role
mutation ChangeRoleMember($varChangeRoleMember: IptCompanyMemberData!) {
  changeRoleMember(args: $varChangeRoleMember)
}

# Remove member from company
mutation DeleteCompanyMember($varDeleteCompanyMember: DelCompanyMemberData!) {
  deleteCompanyMember(args: $varDeleteCompanyMember)
}

# Create a new company role
mutation RegisterCompanyRole($varRegisterCompanyRole: IptRoleMemberData!) {
  registerCompanyRole(args: $varRegisterCompanyRole)
}

# Update company role name
mutation ChangeNameRoleCompany($varChangeNameRoleCompany: IptUpdateNameRoleData!) {
  changeNameRoleCompany(args: $varChangeNameRoleCompany)
}

# Delete a company role
mutation DeleteCompanyRole($varDeleteCompanyRole: DelRoleMemberData!) {
  deleteCompanyRole(args: $varDeleteCompanyRole)
}

# Add access permissions to a role
mutation AddAccessRole($varAddAccessRole: IptRoleAccessData!) {
  addAccessRole(args: $varAddAccessRole)
}

# Remove access permissions from a role
mutation DeleteAccessRole($varDeleteAccessRole: DelRoleAccessData!) {
  deleteAccessRole(args: $varDeleteAccessRole)
}

# ============================================================================
# SHARED SEARCH QUERIES
# ============================================================================

query SearchUsersForAccess(
    $search: String!,
    $excludeUuids: [UUID!],
    $IptPaginate: IptPaginate
  ) {
  users(args: {
    search: $search,
    excludeUuids: $excludeUuids
  }, paginate: $IptPaginate) {
    uuid
    username
    firstname
    lastname
    imageFile {
      uuid
      filename
      filesize
      downloadUrl
    }
  }
}

query SearchCompaniesForAccess(
    $search: String!,
    $excludeUuids: [UUID!],
    $IptPaginate: IptPaginate
  ) {
  companies(args: {
    search: $search,
    excludeUuids: $excludeUuids
  }, paginate: $IptPaginate) {
    uuid
    shortname
    inn
    imageFile {
      uuid
      filename
      filesize
      downloadUrl
    }
  }
}