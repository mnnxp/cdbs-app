# ============================================================================
# RBAC
# ============================================================================

query GetPermissions {
  permissions(permissionIds: [1,3]) {
    typeAccessId
    langId
    name
  }
}

# ============================================================================
# COMPONENT RBAC
# ============================================================================

query GetComponentAccessList($componentUuid: UUID!) {
  getUsersListAccessComponent(componentUuid: $componentUuid) {
    user {
      uuid
      firstname
      lastname
      username
      imageFile {
        uuid
        filename
        filesize
        downloadUrl
      }
    }
    permission {
      typeAccessId
      langId
      name
    }
    isEnabled
    createdAt
    updatedAt
  }
  getCompaniesListAccessComponent(componentUuid: $componentUuid) {
    company {
      uuid
      shortname
      inn
      imageFile {
        uuid
        filename
        filesize
        downloadUrl
      }
    }
    permission {
      typeAccessId
      langId
      name
    }
    isEnabled
    createdAt
    updatedAt
  }
}

mutation SetUserAccessComponent($varSetUserAccessComponent: IptUserAccessComponentData!) {
  setUserAccessComponent(args: $varSetUserAccessComponent)
}

mutation DeleteUserAccessComponent($varDeleteUserAccessComponent: DelUserAccessComponentData!) {
  deleteUserAccessComponent(args: $varDeleteUserAccessComponent)
}

mutation SetCompanyAccessComponent($varSetCompanyAccessComponent: IptCompanyAccessComponentData!) {
  setCompanyAccessComponent(args: $varSetCompanyAccessComponent)
}

mutation DeleteCompanyAccessComponent($varDeleteCompanyAccessComponent: DelCompanyAccessComponentData!) {
  deleteCompanyAccessComponent(args: $varDeleteCompanyAccessComponent)
}

